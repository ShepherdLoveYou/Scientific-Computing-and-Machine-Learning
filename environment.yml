name: scml
# Local development environment (Windows / Linux / macOS).
# Creation command (Windows, per this project's D-drive conda convention):
#   conda env create -p D:\Conda\envs\scml -f environment.yml
#
# Note: fenics-dolfinx and lammps are INTENTIONALLY NOT here. Neither
# has a Windows conda-forge build (FEniCSx is Linux/macOS only) and the
# Chinese mirror of conda-forge does not ship LAMMPS. The Docker image
# (see Dockerfile) installs both via micromamba on Linux, so the HF
# Space deployment and the CI nbconvert run cover Chapter07/4 and
# Chapter09/4. Locally on Windows those two notebooks should be run
# inside the Docker container instead.
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - jupyterlab>=4.2,<5
  - numpy>=1.26,<2.1
  - scipy>=1.13,<2
  - sympy>=1.13,<2
  - pandas>=2.2,<3
  - matplotlib>=3.8,<4
  - seaborn>=0.13,<1
  - scikit-learn>=1.5,<2
  # pytorch is installed via pip from the official CPU index below; the
  # conda-forge pytorch-cpu Windows build has an intermittent DLL-load
  # failure (missing _C.pyd runtime dep) so we avoid it on Windows.
  - ase>=3.23
  - ipywidgets>=8.1
  - bqplot>=0.12.43
  - k3d>=2.16
  - nbconvert>=7.16
  - nbclient>=0.10
  - pypdf>=5.0
  # pip-installed packages are installed SEPARATELY after env creation,
  # because conda env create's internal pip subprocess inherits the base
  # env's Python 3.13 stdlib and fails. Run scripts/setup-env.ps1 for the
  # full two-step bootstrap.
  # Equivalent command:
  #   D:/Conda/envs/scml/python.exe -m pip install \
  #     --index-url https://download.pytorch.org/whl/cpu \
  #     --extra-index-url https://pypi.org/simple \
  #     "torch>=2.4,<3" torchvision "keras>=3.5,<4" "progress>=1.6"
