name: test-notebooks

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "ReferenceBooks/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-notebooks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nbconvert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up micromamba (matches Dockerfile builder env)
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          environment-name: scml
          cache-environment: true
          cache-downloads: true

      # environment.yml intentionally omits pip packages (works around a
      # Windows conda-pip-subprocess bug that doesn't affect Linux). We
      # install the handful of pure-Python pip-only packages here instead,
      # matching the pip: block in environment-docker.yml.
      - name: Install pip-only packages
        shell: bash -l {0}
        run: |
          python -m pip install --no-cache-dir \
            scikit-fem>=10 \
            vegas>=6.0 \
            ipyvolume>=0.6.3 \
            ipython_genutils>=0.2 \
            version_information>=1.0.4 \
            progress>=1.6

      - name: Verify environment
        shell: bash -l {0}
        run: |
          python scripts/verify-env.py

      - name: Execute all notebooks
        shell: bash -l {0}
        run: |
          python _test_notebooks.py --timeout 180
